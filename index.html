<script>
    // 본인의 API 키를 아래 따옴표 안에 넣으세요
    const MY_API_KEY = "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"; 

    async function generateImage() {
        const formula = document.getElementById('formula').value;
        const resultDiv = document.getElementById('result');

        // 이제 키를 체크하는 로직 대신 변수를 사용합니다
        if (!MY_API_KEY || MY_API_KEY === "YOUR_OPENAI_API_KEY_HERE") {
            alert("코드 내부에 API 키를 올바르게 입력해주세요!");
            return;
        }

        resultDiv.innerHTML = "<p class='loading'>학생이 연필로 쓰는 중... 잠시만 기다려주세요.</p>";

        const prompt = `A realistic top-down photo of the mathematical equation '${formula}' handwritten in pencil on a piece of lined school notebook paper. Natural graphite texture, slightly irregular student handwriting, subtle smudges, soft natural lighting.`;

        try {
            const response = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${MY_API_KEY}` // 내장된 키 사용
                },
                body: JSON.stringify({
                    model: "dall-e-3",
                    prompt: prompt,
                    n: 1,
                    size: "1024x1024"
                })
            });

            const data = await response.json();
            if (data.data && data.data[0].url) {
                resultDiv.innerHTML = `<img src="${data.data[0].url}" alt="Handwritten Formula">`;
            } else {
                console.error(data);
                resultDiv.innerHTML = "<p>이미지 생성에 실패했습니다. API 키의 권한이나 잔액을 확인해주세요.</p>";
            }
        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = "<p>오류가 발생했습니다.</p>";
        }
    }
</script>
