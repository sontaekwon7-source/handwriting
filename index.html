<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Pencil Artist ✏️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #357ABD; }
        #result { margin-top: 30px; }
        img { max-width: 100%; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>✏️ Math Pencil Artist</h1>
    <p>수식을 입력하면 연필 손글씨로 그려줍니다.</p>
    
    <input type="password" id="apiKey" placeholder="OpenAI API Key를 입력하세요">
    <input type="text" id="formula" placeholder="수식을 입력하세요 (예: E=mc^2)" value="x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}">
    <br>
    <button onclick="generateImage()">그림 그리기</button>

    <div id="result">
        </div>
</div>

<script>
    async function generateImage() {
        const apiKey = document.getElementById('apiKey').value;
        const formula = document.getElementById('formula').value;
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert("API 키를 입력해주세요!");
            return;
        }

        resultDiv.innerHTML = "<p class='loading'>학생이 연필로 쓰는 중... 잠시만 기다려주세요.</p>";

        const prompt = `A realistic top-down photo of the mathematical equation '${formula}' handwritten in pencil on a piece of lined school notebook paper. Natural graphite texture, slightly irregular student handwriting, subtle smudges, soft natural lighting.`;

        try {
            const response = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "dall-e-3",
                    prompt: prompt,
                    n: 1,
                    size: "1024x1024"
                })
            });

            const data = await response.json();
            if (data.data && data.data[0].url) {
                resultDiv.innerHTML = `<img src="${data.data[0].url}" alt="Handwritten Formula">`;
            } else {
                resultDiv.innerHTML = "<p>이미지 생성에 실패했습니다. API 키나 입력을 확인해주세요.</p>";
            }
        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = "<p>오류가 발생했습니다.</p>";
        }
    }
</script>

</body>
</html>
