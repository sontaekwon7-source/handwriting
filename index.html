<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Pencil Artist ✏️</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .main-container {
            display: flex;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 95%;
            gap: 20px;
        }
        /* 왼쪽 입력 영역 */
        .left-panel { flex: 1; padding: 10px; }
        /* 오른쪽 결과 영역 */
        .right-panel { 
            flex: 1.2; 
            background: #fafafa; 
            border: 2px dashed #ddd; 
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            position: relative;
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #333; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 2px solid #eee; font-size: 16px; box-sizing: border-box;
            margin-bottom: 20px;
        }
        button {
            width: 100%; padding: 15px; background: #0084ff; color: white;
            border: none; border-radius: 12px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: wait; }

        #status { margin-top: 15px; color: #0084ff; font-weight: bold; display: none; }
        img { max-width: 90%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .download-btn {
            margin-top: 20px; padding: 12px 25px; background: #28a745;
            color: white; text-decoration: none; border-radius: 8px; font-weight: bold;
        }
        .error-box { color: #d63031; padding: 20px; text-align: left; font-size: 13px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <h1>✏️ Math Pencil Artist</h1>
        <p style="color:#666; font-size:14px;">수식을 입력하면 연필 그림으로 그려줍니다.</p>
        <input type="text" id="formula" value="1/2+3/4=4/6" placeholder="수식을 입력하세요">
        <button id="drawBtn" onclick="generateImage()">그림 그리기</button>
        <div id="status">⏳ 학생이 연필로 적는 중... 잠시만 기다려주세요!</div>
    </div>

    <div class="right-panel" id="resultArea">
        <p id="infoText" style="color:#aaa;">그림이 여기에 나타납니다.</p>
    </div>
</div>

<script>
    // ★★★ 본인의 OpenAI API 키를 반드시 따옴표 안에 넣으세요 ★★★
    const MY_KEY = "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"; 

    async function generateImage() {
        const formula = document.getElementById('formula').value;
        const resultArea = document.getElementById('resultArea');
        const status = document.getElementById('status');
        const drawBtn = document.getElementById('drawBtn');

        if (!MY_KEY || MY_KEY.includes("여기에")) {
            alert("코드 내부에 API 키를 입력해야 작동합니다!");
            return;
        }

        // 화면 상태 업데이트
        status.style.display = "block";
        drawBtn.disabled = true;
        resultArea.innerHTML = "<p>🎨 AI가 분석 중입니다...</p>";

        try {
            const response = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${MY_KEY.trim()}`
                },
                body: JSON.stringify({
                    model: "dall-e-3",
                    prompt: `A realistic top-down photo of the math equation '${formula}' written in pencil on lined paper. Natural student's handwriting, visible graphite texture, soft natural lighting.`,
                    n: 1,
                    size: "1024x1024"
                })
            });

            const data = await response.json();

            if (response.ok) {
                const imgUrl = data.data[0].url;
                resultArea.innerHTML = `
                    <img src="${imgUrl}" alt="result">
                    <a href="${imgUrl}" target="_blank" download="math.png" class="download-btn">
